<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spotter</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { display: flex; flex-direction: column; font: 13px system-ui, sans-serif; background: #111; color: #eee; }
      #bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #333; }
      #read { padding: 4px 10px; border: 1px solid #ff8c00; border-radius: 4px; background: #ff8c00; color: #111; font-weight: 600; cursor: pointer; }
      #read:disabled { opacity: 0.6; cursor: default; }
      #status { flex: 1; min-width: 0; overflow-wrap: anywhere; color: #aaa; }
      #status.ok { color: #4ade80; }
      #status.error { color: #f87171; }
      #app { flex: 1; width: 100%; border: 0; background: #0b1430; }
      #devbar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-top: 1px solid #333; font-size: 11px; color: #888; }
      #devbar label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="read" type="button">Read this page</button>
      <span id="status"></span>
    </div>
    <iframe id="app" allow="display-capture; clipboard-read; clipboard-write"></iframe>
    <div id="devbar">
      <label><input id="dev" type="checkbox" /> Dev: use localhost</label>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
