<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spotter</title>
    <style>
      :root { --ink: #101827; --mint: #38d6a1; --paper: #f3f1e8; --green: #3a9d5d; --red: #d7352f; --mono: ui-monospace, Menlo, Consolas, monospace; }
      html, body { margin: 0; height: 100%; }
      body { display: flex; flex-direction: column; font: 13px system-ui, sans-serif; background: var(--paper); color: var(--ink); }
      #bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--mint); border-bottom: 3px solid var(--ink); }
      #read {
        flex-shrink: 0; padding: 6px 10px; background: #fff; color: var(--ink);
        font: 800 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em;
        border: 3px solid var(--ink); border-radius: 4px; box-shadow: 3px 3px 0 var(--ink);
        cursor: pointer; transition: transform 80ms, box-shadow 80ms;
      }
      #read:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
      #read:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      #read:disabled { opacity: 0.6; cursor: default; }
      #status { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--ink); font: 700 11px/1.3 var(--mono); }
      #status .check { color: var(--green); font-size: 12px; margin-right: 2px; }
      #status.error { color: var(--red); }
      #app { flex: 1; width: 100%; border: 0; background: var(--paper); }
      #devbar { display: flex; align-items: center; gap: 6px; padding: 4px 12px; background: var(--paper); border-top: 2px solid var(--ink); color: var(--ink); font: 11px var(--mono); }
      #devbar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
      #devbar input { accent-color: var(--ink); margin: 0; }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="read" type="button">Read this page</button>
      <span id="status"></span>
    </div>
    <iframe id="app" allow="display-capture; clipboard-read; clipboard-write"></iframe>
    <div id="devbar">
      <label><input id="dev" type="checkbox" /> Dev: use localhost</label>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
